name: Control de tasas de ARCA

# Una vez por semana compara tasas.json contra la tabla oficial de ARCA. Si hay una
# tasa nueva, deja la rama con el cambio hecho y abre un issue avisando. No mergea
# solo a proposito: la tasa entra en liquidaciones que van a un expediente, asi que
# la ultima palabra la tiene una persona.
#
# Tambien se puede correr a mano desde la pestaña Actions ("Run workflow").

on:
  schedule:
    - cron: '13 12 * * 1'   # lunes 12:13 UTC = 09:13 en Argentina
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  controlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comparar contra la pagina de ARCA
        id: control
        run: |
          set +e
          python actualizar_tasas.py --escribir > salida.txt 2>&1
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          cat salida.txt

      - name: Avisar si no se pudo verificar
        if: steps.control.outputs.codigo == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --label tasas-error --state open --limit 1 | grep -q .; then
            echo "Ya hay un issue abierto por este motivo."
            exit 0
          fi
          gh label create tasas-error --color B42318 \
            --description "El control de tasas no pudo leer la pagina de ARCA" 2>/dev/null || true
          gh issue create --label tasas-error \
            --title "No se pudo verificar las tasas contra ARCA" \
            --body "$(printf 'El control semanal no pudo leer la tabla de tasas de ARCA.\n\nLa app sigue liquidando con las tasas que ya tiene cargadas, que son las ultimas verificadas: no hay riesgo inmediato. Pero si esto se repite varias semanas, conviene revisar si la pagina cambio de formato.\n\n```\n%s\n```\n' "$(cat salida.txt)")"

      - name: Abrir rama e issue si hay una tasa nueva
        if: steps.control.outputs.codigo == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rama="tasas/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git add tasas.json
          git commit -m "Actualizar tasas de ARCA ($(date -u +%d/%m/%Y))" -m "$(cat salida.txt)"
          git push --force origin "$rama"

          gh label create tasas --color 1E3A8A \
            --description "Cambios en las tasas de interes de ARCA" 2>/dev/null || true
          gh issue create --label tasas \
            --title "Tasas de ARCA: hay novedades ($(date -u +%d/%m/%Y))" \
            --body "$(printf 'El control semanal encontro diferencias entre `tasas.json` y la tabla oficial de ARCA.\n\nEl cambio ya esta hecho en la rama **%s**. Para aplicarlo, abri el pull request desde aca:\n\nhttps://github.com/%s/compare/%s?expand=1\n\nRevisa que las tasas coincidan con la pagina de ARCA antes de mergear:\nhttps://serviciosweb.afip.gob.ar/genericos/calculoInteres/punitorios.aspx\n\n**Ojo con los dias del tramo:** ARCA publica las fechas y las tasas, pero no los dias que computa por tramo. Un tramo nuevo entra sin ese dato y la app los cuenta sola avisando en pantalla. Para dejarlo exacto hay que pedirle a ARCA un detalle de calculo que atraviese el tramo nuevo y copiar el numero al campo `dias`.\n\n```\n%s\n```\n' "$rama" "${{ github.repository }}" "$rama" "$(cat salida.txt)")"
